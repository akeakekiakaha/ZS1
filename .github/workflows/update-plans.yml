name: Aktualizuj plany lekcji

on:
  schedule:
    # Niedziela, 20:17 czasu polskiego (CET/CEST).
    - cron: "17 20 * * 0"
      timezone: "Europe/Warsaw"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: teacher-finder-data-imports
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Skonfiguruj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zainstaluj zależności
        run: pip install -r requirements.txt
      - name: Pobierz i przetwórz plany
        run: python scripts/import_plans.py
      - name: Zapisz zmienioną bazę
        run: |
          if [[ -n "$(git status --porcelain data/lessons.json)" ]]; then
            git config user.name "teacher-finder-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/lessons.json
            git commit -m "Aktualizacja planów lekcji"
            git push
          else
            echo "Brak zmian w planach."
          fi
